# @package _global_

defaults:
  - train
  - override /task: robotwin_aed_wam_vae_memory_3cam384_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  robotwin_root: third_party/RoboTwin
  policy_name: wam_policy
  task_name: null
  task_names: null
  task_config: demo_randomized
  instruction_type: unseen
  eval_num_episodes: 100
  seed_manifest_path: null
  strict_seed_manifest: true
  fixed_seed_max_attempts: 3
  # Match RoboTwin's official evaluation: immediately skip seeds whose
  # environment/expert validation is invalid. Policy rollout failures still count.
  replace_failed_seed: true
  build_seed_manifest_only: false
  seed_manifest_output_path: null
  output_dir: ./evaluate_results/robotwin/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Optional rollout cap. Open-microwave launchers set this to 750 (75 s at 10 FPS).
  # Keep the shared default unset so other tasks retain their official horizons.
  step_limit: null
  task_step_limits: {}

  # Action inference
  action_horizon: null
  replan_steps: 24
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  timing_enabled: false
  skip_get_obs_within_replan: true

  # Runtime inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  enabled: false
  num_gpus: 8
  gpu_ids: null
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
