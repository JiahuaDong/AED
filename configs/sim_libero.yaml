# @package _global_

defaults:
  - train
  - override /task: libero_uncond_2cam224_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Runtime behavior
  env_num: 1
  # Simulator render size; the model input size is set by the checkpoint.
  render_resolution: 256
  required_mujoco_version: "3.3.2"
  training_instruction_map: null
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false
  record_subgoal_metrics: false
  # auto: use the filename-derived instruction for standard LIBERO and the BDDL
  # :language field for LIBERO-Plus variants, so perturbation IDs stay out of
  # the prompt. task.language is also available.
  prompt_source: auto

  # Optional missed-grasp retry. When enabled, an empty closed gripper is
  # reopened and the stale action chunk is discarded before replanning.
  oracle_grasp_retry: false
  oracle_grasp_confirm_steps: 3
  oracle_gripper_closed_threshold: 0.008
  oracle_grasp_max_retries: 3
  oracle_grasp_open_steps: 3

  # Action inference
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
