train:
  _target_: wam.datasets.lerobot.history_robot_video_dataset.HistoryRobotVideoDataset
  dataset_dirs:
    - ${oc.env:LIBERO_DATASET_ROOT,./data/libero_mujoco3.3.2}
  shape_meta:
    images:
      - key: image
        raw_shape: [3, 256, 256]
        shape: [3, 224, 224]
      - key: image2
        raw_shape: [3, 256, 256]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 7
        shape: 7
    state:
      - key: default
        raw_shape: 8
        shape: 8
  # Continuous action-rate window: 32 actions and 33 observations. The video
  # branch/history memory sees observations [0,4,...,32], i.e. 9 aligned frames.
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [224, 448]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  # Surface corrupt videos, missing text caches, and shape mismatches immediately.
  strict_sample_errors: true
  concat_multi_camera: horizontal
  # HuggingFaceVLA/libero stores the environment command directly: -1=open, +1=close.
  gripper_action_convention: simulator_minus_one_one
  processor:
    _target_: wam.datasets.lerobot.processors.wam_processor.WAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 7
    proprio_output_dim: 8
    # LIBERO uses relative Cartesian commands and an absolute gripper command.
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false]
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: wam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: wam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: wam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: ${oc.env:LIBERO_TEXT_CACHE,./data/text_embeds_cache/libero_hf}
  context_len: 128
  pretrained_norm_stats: ${oc.env:LIBERO_NORM_STATS,./data/dataset_stats/libero_hf_v3_global.json}
